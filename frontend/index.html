<body>
  <div id="root"></div>

  <script>
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPwaPrompt = e;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // On local dev, unregister service workers and purge caches to guarantee 100% fresh dev assets
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              keys.forEach((k) => caches.delete(k));
            });
          }
        } else {
          navigator.serviceWorker.register('/sw.js').then((reg) => reg.update()).catch((err) => {
            console.warn('PWA SW Registration Notice:', err);
          });
        }
      });
    }
  </script>
