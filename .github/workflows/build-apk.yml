name: Build Standalone Mobile APKs (Worker & Admin)

on:
  push:
    branches: [ main, nikhil-branch ]
  workflow_dispatch:

jobs:
  build-worker-apk:
    name: Build Worker App APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: worker-frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Worker Dependencies
        run: |
          cd worker-frontend
          npm ci || npm install

      - name: Inject Version Code into Worker App
        run: |
          echo "export const CURRENT_APP_VERSION_CODE = ${{ github.run_number }};" > worker-frontend/src/utils/appVersion.ts
          echo "export const CURRENT_APP_VERSION_NAME = '1.0.${{ github.run_number }}';" >> worker-frontend/src/utils/appVersion.ts
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/g" worker-frontend/android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/g" worker-frontend/android/app/build.gradle || true

      - name: Build Worker Web App Assets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://jbj-central-backend.onrender.com/api' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://jbj-central-backend.onrender.com/api' }}
        run: |
          cd worker-frontend
          npm run build

      - name: Add & Sync Capacitor Android
        run: |
          cd worker-frontend
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Build Android Debug APK (Gradle)
        run: |
          cd worker-frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Worker Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JayaBhavaniWorker-Standalone-APK
          path: worker-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Worker APK to Supabase Public Storage (Auto-overwrite)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://wdlbeiqwbwnjywpqcfbq.supabase.co/storage/v1/object/apks/JayaBhavaniWorker.apk" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkbGJlaXF3Ynduanl3cHFjZmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjA3NTE0NiwiZXhwIjoyMTAxNjUxMTQ2fQ.B0YPVbLgOaAEFpiHuP0Fx9100Pfy5fNtLkaaOc9q1_g" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@worker-frontend/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Register Worker App Version in Supabase DB
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://wdlbeiqwbwnjywpqcfbq.supabase.co/rest/v1/app_versions?on_conflict=app_id" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkbGJlaXF3Ynduanl3cHFjZmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjA3NTE0NiwiZXhwIjoyMTAxNjUxMTQ2fQ.B0YPVbLgOaAEFpiHuP0Fx9100Pfy5fNtLkaaOc9q1_g" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkbGJlaXF3Ynduanl3cHFjZmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjA3NTE0NiwiZXhwIjoyMTAxNjUxMTQ2fQ.B0YPVbLgOaAEFpiHuP0Fx9100Pfy5fNtLkaaOc9q1_g" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d '{"app_id": "WORKER", "version_code": ${{ github.run_number }}, "version_name": "1.0.${{ github.run_number }}", "apk_url": "https://wdlbeiqwbwnjywpqcfbq.supabase.co/storage/v1/object/public/apks/JayaBhavaniWorker.apk"}'

  build-admin-apk:
    name: Build Admin App APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Admin Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Inject Version Code into Admin App
        run: |
          echo "export const CURRENT_APP_VERSION_CODE = ${{ github.run_number }};" > frontend/src/utils/appVersion.ts
          echo "export const CURRENT_APP_VERSION_NAME = '1.0.${{ github.run_number }}';" >> frontend/src/utils/appVersion.ts
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/g" frontend/android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/g" frontend/android/app/build.gradle || true

      - name: Build Admin Web App Assets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://jbj-central-backend.onrender.com/api' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://jbj-central-backend.onrender.com/api' }}
        run: |
          cd frontend
          npm run build

      - name: Add & Sync Capacitor Android
        run: |
          cd frontend
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Build Android Debug APK (Gradle)
        run: |
          cd frontend/android
          chmod +x gradlew
